version: "3.9"

# ─── DÉVELOPPEMENT LOCAL ────────────────────────────────────────────────────────
# Usage : docker compose up -d
# (Production : docker compose -f docker-compose.prod.yml up -d)

services:
  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: edg_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-edgdev2024}
      MYSQL_DATABASE: ${DATABASE_NAME:-edg_ticketing}
      MYSQL_USER: ${DATABASE_USERNAME:-edg_user}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-edgdev2024}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD:-edgdev2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: edg_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ClamAV ───────────────────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: edg_clamav
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edg_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOSTNAME: db
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (dev = Vite directement, prod = voir docker-compose.prod.yml) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    container_name: edg_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  clamav_db:
  uploads:
