version: "3.9"

# ─── PRODUCTION ────────────────────────────────────────────────────────────────
# Usage : docker compose -f docker-compose.prod.yml up -d
# Prérequis : fichier backend/.env.production chargé en secrets

services:
  db:
    image: mysql:8.0
    container_name: edg_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: edg_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    container_name: edg_clamav
    restart: always
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edg_backend
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_HOSTNAME: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      APP_ENV: production
      DISABLE_AUTH: "False"
      DEBUG_MODE: "false"
    volumes:
      - uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: edg_frontend
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    container_name: edg_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - internal
    depends_on:
      - backend
      - frontend

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  clamav_db:
  uploads:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
